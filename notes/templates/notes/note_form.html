{% extends 'notes/base.html' %}

{% block title %}{% if note %}Edit Note{% else %}New Note{% endif %} - Sticky Notes{% endblock %}

{% block content %}
<h2>{% if note %}Edit Note{% else %}Create New Note{% endif %}</h2>

<form method="post" style="max-width: 500px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="padding: 8px 16px; background-color: #28a745; color: white; border: none; cursor: pointer;">
        Save Note
    </button>
    <a href="{% url 'note_list' %}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
