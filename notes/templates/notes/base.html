{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sticky Notes App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}?v=1">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sticky Notes</h1>
            <nav>
                <a href="{% url 'note_list' %}" style="font-size: 1.5rem; font-weight: bold; color: #0056b3; margin-right: 15px; text-decoration: none;">Home</a>
                <a href="{% url 'note_create' %}" class="btn-primary">+ New Note</a>
            </nav>
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
